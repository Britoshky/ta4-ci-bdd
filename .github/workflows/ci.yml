name: CI - Maven Tests + BDD + Performance

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test
        run: mvn -B clean test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
      - name: Upload cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-html-report

  perf:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile code
        run: mvn -B clean compile
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Start server
        run: |
          echo "Starting server..."
          java -cp target/classes cl.iplacex.ta4.perf.SimpleLoginServer > server.log 2>&1 &
          echo "Waiting for server to be ready..."
          for i in {1..15}; do
            if curl -f -sS http://localhost:8080/health > /dev/null 2>&1; then
              echo "✓ Server is up and responding!"
              break
            fi
            echo "Attempt $i/15: Server not ready yet..."
            sleep 2
          done
          if ! curl -f -sS http://localhost:8080/health > /dev/null 2>&1; then
            echo "ERROR: Server failed to start. Logs:"
            cat server.log
            exit 1
          fi
      - name: Run k6
        run: k6 run perf/k6-login.js
      - name: Upload perf logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-and-server-logs
          path: server.log
